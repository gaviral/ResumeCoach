# Resume Coach — decommissioned. Deploy and AWS credential steps removed.
# Manual / PR build-only validation. Pushes to main must not deploy or
# consume AWS credentials.
name: CI (build only)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint / Build / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (root + workspace)
        run: npm ci

      - name: Lint front-end
        run: npm run -w frontend lint --if-present

      - name: Build front-end (no live API URL; build-only)
        run: npm run -w frontend build
        env:
          VITE_API_URL: https://example.invalid

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install back-end deps
        run: pip install -r backend/requirements.txt

      - name: Run back-end tests (placeholder)
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests yet – skipping."
          fi

      - name: Block AWS deploy (retired)
        run: |
          echo "Resume Coach is decommissioned. AWS configure/synth/deploy steps are disabled."
          echo "See DECOMMISSIONED.md. Refusing to continue to any deploy path."
